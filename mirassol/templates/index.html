<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mirassol FC{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-z5a1XQhB2I4+P1Nwq7cq8+2qja6zF+VgB9jX+6wq5hR6x3D5vF3xHBfZ2OpsYFbM" crossorigin="anonymous">
    <style>
        :root {
            --club-yellow: #f9d70b;
            --club-green: #154734;
        }
        body {
            background: #f7f7f7;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .navbar {
            background: linear-gradient(90deg, var(--club-green), #1d7d42);
        }
        .footer {
            background: var(--club-green);
            color: white;
        }
        .card-title {
            color: var(--club-green);
        }
        .section-title {
            color: var(--club-green);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'inicio' %}">Mirassol FC</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon" style="color: white;"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'equipe' %}">Elenco</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'sobre' %}">Sobre</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer py-4">
        <div class="container text-center">
            <p class="mb-0">&copy; {% now "Y" %} Mirassol Futebol Clube. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-81akavAk5m+GPW6kRjezaG74xa3xjJa9z1k9hk6nS7x1Gk5yls4KyGnXj8JMhK8D" crossorigin="anonymous"></script>
</body>
</html>
