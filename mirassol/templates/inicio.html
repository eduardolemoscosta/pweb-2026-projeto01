{% extends 'index.html' %}

{% block title %}Início - Mirassol FC{% endblock %}

{% block content %}
<div class="row align-items-center">
    <div class="col-lg-6">
        <h1 class="section-title">{{ titulo }}</h1>
        <p class="lead">{{ historico }}</p>
        <p>Conheça o Maião, o estádio que recebe as partidas do Mirassol FC e inspira a torcida do Leão Caipira.</p>
    </div>
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <img src="{{ estadio_url }}" class="card-img-top" alt="Estádio Maião">
        </div>
    </div>
</div>
{% endblock %}
